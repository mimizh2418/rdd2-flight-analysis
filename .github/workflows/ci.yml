name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  checks:
    name: Formatting and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-nix-downloads-${{ hashFiles('flake.lock', 'package-lock.json', 'uv.lock') }}

      - name: Validate the locked Nix environment
        run: nix flake check --no-update-lock-file --no-build

      - name: Install locked dependencies
        run: nix develop --no-update-lock-file --command rdd2-install

      - name: Check repository, Python, and Nix formatting
        run: nix develop --no-update-lock-file --command rdd2-check

      - name: Run core tests
        run: nix develop --no-update-lock-file --command rdd2-test-core

      - name: Run Python tests
        run: nix develop --no-update-lock-file --command rdd2-test-python

  browser:
    name: Production build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLAYWRIGHT_HTML_OPEN: never

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-nix-downloads-${{ hashFiles('flake.lock', 'package-lock.json', 'uv.lock') }}

      - name: Install locked dependencies
        run: nix develop --no-update-lock-file --command rdd2-install

      # Playwright keeps one worker for rendering/timing assertions and starts its own production preview server.
      # The Nix shortcut builds first and uses pinned Chromium against the production preview.
      # Simulation-artifact tests skip until RDD2_GPS_TRACE and RDD2_RUMOCA_BUNDLE fixtures are supplied.
      - name: Type-check, build, and run browser tests
        id: tests
        run: >-
          nix develop --no-update-lock-file --command
          rdd2-test-browser --forbid-only --trace=retain-on-failure --reporter=line,html

      - name: Upload browser reports and traces
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  pages:
    name: Deploy GitHub Pages
    needs: [checks, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-nix-downloads-${{ hashFiles('flake.lock', 'package-lock.json', 'uv.lock') }}

      - name: Install locked dependencies
        run: nix develop --no-update-lock-file --command rdd2-install

      # Apply the repository subdirectory only to the deployed build; local CI previews keep their root URL.
      - name: Build for GitHub Pages
        run: nix develop --no-update-lock-file --command rdd2-build --base /rdd2-flight-analysis/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
